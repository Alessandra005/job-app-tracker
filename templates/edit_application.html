
{% extends "base.html" %}

{% block title %}Edit Application | Job Tracker{% endblock %}

{% block content %}

<section class="page-header">
    <div>
        <p class="eyebrow">YOUR JOB SEARCH</p>
        <h1>Edit application</h1>
        <p class="subtitle">Update the details of this application.</p>
    </div>
</section>

<section class="form-section">

    <form
        action="{{ url_for('edit_application', application_id=application.application_id) }}"
        method="POST"
    >

        <div class="form-grid">

            <div class="form-group">
                <label for="job_id">Job</label>
                <select id="job_id" name="job_id" required>
                    {% for job in jobs %}
                    <option
                        value="{{ job.job_id }}"
                        {% if job.job_id == application.job_id %}selected{% endif %}
                    >
                        {{ job.job_title }} — {{ job.company_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="application_date">Application date</label>
                <input
                    type="date"
                    id="application_date"
                    name="application_date"
                    value="{{ application.application_date }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>

                    {% set statuses = [
                        "Applied", "Screening", "Interview",
                        "Offer", "Rejected", "Withdrawn"
                    ] %}

                    {% if application.status not in statuses %}
                    <option value="{{ application.status }}" selected>
                        {{ application.status }} (existing status)
                    </option>
                    {% endif %}

                    {% for status in statuses %}
                    <option
                        value="{{ status }}"
                        {% if application.status == status %}selected{% endif %}
                    >
                        {{ status }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label for="resume_version">Resume version</label>
                <input
                    type="text"
                    id="resume_version"
                    name="resume_version"
                    value="{{ application.resume_version or '' }}"
                    placeholder="e.g. v3.0"
                >
            </div>

            <div class="form-group">
                <label for="interview_data">Interview information (JSON)</label>
                <textarea
                    id="interview_data"
                    name="interview_data"
                    rows="5"
                    placeholder='{"feedback": "Good interview"}'
                >{{ application.interview_data or '' }}</textarea>
                <p class="form-hint">
                    Enter valid JSON, or leave blank if there is no interview information.
                </p>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input
                        type="checkbox"
                        name="cover_letter_sent"
                        value="1"
                        {% if application.cover_letter_sent %}checked{% endif %}
                    >
                    Cover letter sent
                </label>
            </div>

        </div>

        <div class="actions">
            <button type="submit" class="primary-button">
                Save changes
            </button>

            <a href="{{ url_for('applications') }}" class="edit-link">
                Cancel
            </a>
        </div>

    </form>

</section>

{% endblock %}
