<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Job Application Tracker{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}" class="brand">
            job<span>tracker.</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('companies') }}">Companies</a>
            <a href="{{ url_for('jobs') }}">Jobs</a>
            <a href="{{ url_for('applications') }}">Applications</a>
            <a href="{{ url_for('contacts') }}">Contacts</a>
            <a href="{{ url_for('job_match') }}">Job Match</a>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="flash-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <div class="page-content">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        Job Application Tracker
    </footer>

</body>
</html>
